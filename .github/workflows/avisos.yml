name: Avisos semanais de avenças

on:
  # DESATIVADO: para ligar os avisos semanais, tira o # das duas linhas abaixo.
  # schedule:
  #   - cron: '0 8 * * 1'   # segundas às 08:00 UTC
  workflow_dispatch:         # permite correr à mão em Actions → Run workflow

permissions:
  contents: read

jobs:
  avisos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save nodemailer@6
      - run: node scripts/avisos.mjs
        env:
          SUPABASE_URL: https://byrukjbyhbkjvvlcntqi.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          DIAS_AVISO: '30'
